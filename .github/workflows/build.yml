name: Build

# 使用 nolang 的 build-nolang action 构建多平台二进制文件。
# 本工作流同时充当 nolang 构建系统的集成测试：
#   1. detect-changes: 通过 GitHub API 比较当前 tag 与上一个 release tag，
#      判断 notools / nogit / noimg 哪些子项目有变更，决定是否需要构建
#   2. 浅克隆 (fetch-depth: 1)，只拉取当前 tag 源码，不拉历史
#   3. sed 注入 VERSION（从 tag 提取，去掉 v 前缀）
#   4. no build 交叉编译 6 个目标平台（按需构建）
#   5. 对产物运行 smoke test 验证正确性
#   6. tag 推送时发布 GitHub Release（跳过的子项目从上一个 release 继承）
#
# 依赖：lizongying/nolang 仓库的 .github/actions/build-nolang action

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # ── 检测子项目变更 ─────────────────────────────────────────────────
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      needs-notools: ${{ steps.detect.outputs.needs-notools }}
      needs-nogit: ${{ steps.detect.outputs.needs-nogit }}
      needs-noimg: ${{ steps.detect.outputs.needs-noimg }}
      last-tag: ${{ steps.detect.outputs.last-tag }}
    steps:
      - name: Detect changed subprojects via GitHub API
        id: detect
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          NEW_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          echo "============================================"
          echo "  Change Detection"
          echo "  NEW_TAG: $NEW_TAG"
          echo "  REPO:    $REPO"
          echo "============================================"

          # ── 1. 获取所有 tags，semver 排序，找到上一个 release tag ──
          # GitHub API 分页获取全部 tags
          TAGS_JSON=""
          PAGE=1
          while true; do
            RESP=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/tags?per_page=100&page=${PAGE}")
            COUNT=$(echo "$RESP" | jq 'length')
            if [ "$COUNT" -eq 0 ]; then
              break
            fi
            TAGS_JSON="${TAGS_JSON}${RESP}"
            PAGE=$((PAGE + 1))
            # 安全上限：最多拉 10 页 (1000 tags)
            [ "$PAGE" -gt 10 ] && break
          done

          # 合并所有 tags，提取 tag name，过滤 v* 前缀，semver 排序
          ALL_TAGS=$(echo "$TAGS_JSON" | jq -r '.[].name' | grep '^v[0-9]' | sort -V -r)

          # 找到 NEW_TAG 的上一个 tag
          LAST_TAG=""
          FOUND_CURRENT=false
          while IFS= read -r t; do
            if [ "$FOUND_CURRENT" = "true" ]; then
              LAST_TAG="$t"
              break
            fi
            [ "$t" = "$NEW_TAG" ] && FOUND_CURRENT=true
          done <<< "$ALL_TAGS"

          echo "Last release tag: ${LAST_TAG:-<none>}"

          # ── 2. 边界处理：没有上一个 tag → 全部构建 ──
          if [ -z "$LAST_TAG" ]; then
            echo "::notice::No previous tag found — building all subprojects"
            echo "needs-notools=true"    >> "$GITHUB_OUTPUT"
            echo "needs-nogit=true"      >> "$GITHUB_OUTPUT"
            echo "needs-noimg=true"      >> "$GITHUB_OUTPUT"
            echo "last-tag="             >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # ── 3. 调用 compare API 获取变更文件清单 ──
          echo "Comparing $LAST_TAG...$NEW_TAG"
          COMPARE_URL="https://api.github.com/repos/${REPO}/compare/${LAST_TAG}...${NEW_TAG}"
          COMPARE_JSON=$(curl -fsSL -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "$COMPARE_URL")

          # 提取变更文件路径（files[].filename）
          CHANGED_FILES=$(echo "$COMPARE_JSON" | jq -r '.files[].filename')

          echo ""
          echo "--- Changed files ---"
          echo "$CHANGED_FILES"
          echo ""

          # ── 4. 判断每个子项目是否有变更 ──
          # 子项目路径前缀：notools/  nogit/  noimg/
          # 额外：根目录的 .github/workflows/ 或 package.jsonc 变更也触发全部构建
          NEEDS_NOTOOLS=false
          NEEDS_NOGIT=false
          NEEDS_NOIMG=false

          while IFS= read -r f; do
            [ -z "$f" ] && continue

            # 根级 CI/配置变更 → 全部构建
            case "$f" in
              .github/workflows/*|package.jsonc|workspace.jsonc)
                NEEDS_NOTOOLS=true
                NEEDS_NOGIT=true
                NEEDS_NOIMG=true
                echo "  [root-config] $f → triggers all"
                continue
                ;;
            esac

            # 子项目路径匹配
            case "$f" in
              notools/*)
                NEEDS_NOTOOLS=true
                echo "  [notools] $f"
                ;;
              nogit/*)
                NEEDS_NOGIT=true
                echo "  [nogit] $f"
                ;;
              noimg/*)
                NEEDS_NOIMG=true
                echo "  [noimg] $f"
                ;;
            esac
          done <<< "$CHANGED_FILES"

          echo ""
          echo "============================================"
          echo "  Detection Results"
          echo "============================================"
          echo "  notools: $NEEDS_NOTOOLS"
          echo "  nogit:   $NEEDS_NOGIT"
          echo "  noimg:   $NEEDS_NOIMG"
          echo "  last-tag: $LAST_TAG"
          echo "============================================"

          echo "needs-notools=$NEEDS_NOTOOLS" >> "$GITHUB_OUTPUT"
          echo "needs-nogit=$NEEDS_NOGIT"     >> "$GITHUB_OUTPUT"
          echo "needs-noimg=$NEEDS_NOIMG"     >> "$GITHUB_OUTPUT"
          echo "last-tag=$LAST_TAG"           >> "$GITHUB_OUTPUT"

  # ── 构建 notools ──────────────────────────────────────────────────
  build-notools:
    needs: detect-changes
    if: needs.detect-changes.outputs.needs-notools == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Inject version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          VER="${TAG#v}"
          echo "Injecting VERSION='$VER' (from tag '$TAG')"
          sed -i "s/^VERSION = 'dev'$/VERSION = '$VER'/" notools/main.no
          grep -n '^VERSION' notools/main.no

      - name: Build notools for multiple platforms
        id: build
        uses: lizongying/nolang/.github/actions/build-nolang@v0.2.27
        with:
          version: "0.2.27"
          entry: notools/main.no
          name: notools
          targets: >-
            linux/amd64,
            linux/arm64,
            darwin/amd64,
            darwin/arm64,
            windows/amd64,
            windows/arm64
          cc: zig
          fail-on-error: "true"

      - name: Build report
        if: always()
        shell: bash
        env:
          BINARIES: ${{ steps.build.outputs.binaries }}
          FAILED: ${{ steps.build.outputs.failed }}
          NOLANG_VER: ${{ steps.build.outputs.nolang-version }}
        run: |
          echo "============================================"
          echo "  notools Build Report"
          echo "============================================"
          echo "Nolang version: ${NOLANG_VER:-unknown}"
          echo ""
          echo "--- Built successfully ---"
          if [ -n "$BINARIES" ]; then
            printf '  %s\n' $BINARIES
          else
            echo "  (none)"
          fi
          echo ""
          echo "--- Failed targets ---"
          if [ -n "$FAILED" ]; then
            printf '  %s\n' $FAILED
          else
            echo "  (none)"
          fi

      - name: Smoke test notools (linux/amd64)
        run: |
          set -e
          BIN="dist/notools-linux-amd64"
          if [ ! -f "$BIN" ]; then
            echo "::error::notools linux/amd64 binary not found — critical build failure"
            exit 1
          fi
          chmod +x "$BIN"

          PASS=0; FAIL=0

          check() {
            local desc="$1" actual="$2" expected="$3"
            if [ "$actual" = "$expected" ]; then
              echo "  PASS: $desc"
              PASS=$((PASS+1))
            else
              echo "  FAIL: $desc"
              echo "    expected: '$expected'"
              echo "    actual:   '$actual'"
              FAIL=$((FAIL+1))
            fi
          }

          echo "=== echo ==="
          out=$(echo "hello notools" | "$BIN" echo)
          check "echo stdin" "$out" "hello notools"

          echo "=== version ==="
          TAG="${GITHUB_REF_NAME:-dev}"
          VER="${TAG#v}"
          out=$("$BIN" version)
          check "version" "$out" "notools v$VER (pure Nolang)"

          echo "=== md5 ==="
          out=$(echo -n abc | "$BIN" md5)
          check "md5(abc)" "$out" "900150983cd24fb0d6963f7d28e17f72"

          echo "=== sha1 ==="
          out=$(echo -n abc | "$BIN" sha1)
          check "sha1(abc)" "$out" "a9993e364706816aba3e25717850c26c9cd0d89d"

          echo "=== sha256 ==="
          out=$(echo -n abc | "$BIN" sha256)
          check "sha256(abc)" "$out" "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"

          echo "=== sha512 ==="
          out=$(echo -n abc | "$BIN" sha512)
          expected="ddaf35a193617abacc417349ae20413112e6fa4e89a97ea20a9eeee64b55d39a2192992a274fc1a836ba3c23a3feebbd454d4423643ce80e2a9ac94fa54ca49f"
          check "sha512(abc)" "$out" "$expected"

          echo "=== hmac ==="
          out=$(echo -n abc | "$BIN" hmac -a sha256 -k key)
          check "hmac-sha256(abc,key)" "$out" "9c196e32dc0175f86f4b1cb89289d6619de6bee699e4c378e68309ed97a1a6ab"

          echo "=== basename ==="
          out=$("$BIN" basename /tmp/foo/bar.txt)
          check "basename" "$out" "bar.txt"

          echo "=== dirname ==="
          out=$("$BIN" dirname /tmp/foo/bar.txt)
          check "dirname" "$out" "/tmp/foo"

          echo "=== seq ==="
          out=$("$BIN" seq 1 5 | tr '\n' ' ')
          check "seq 1 5" "$out" "1 2 3 4 5 "

          echo ""
          echo "============================================"
          echo "  notools Smoke test: $PASS passed, $FAIL failed"
          echo "============================================"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Upload notools artifacts
        uses: actions/upload-artifact@v7
        with:
          name: notools-binaries
          path: dist/notools-*
          if-no-files-found: warn

  # ── 构建 nogit ───────────────────────────────────────────────────
  build-nogit:
    needs: detect-changes
    if: needs.detect-changes.outputs.needs-nogit == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Inject version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          VER="${TAG#v}"
          echo "Injecting VERSION='$VER' (from tag '$TAG')"
          sed -i "s/^VERSION = 'dev'$/VERSION = '$VER'/" nogit/main.no
          grep -n '^VERSION' nogit/main.no

      - name: Build nogit for multiple platforms
        id: build
        uses: lizongying/nolang/.github/actions/build-nolang@v0.2.27
        with:
          version: "0.2.27"
          entry: nogit/main.no
          name: nogit
          targets: >-
            linux/amd64,
            linux/arm64,
            darwin/amd64,
            darwin/arm64,
            windows/amd64,
            windows/arm64
          cc: zig
          fail-on-error: "true"

      - name: Build report
        if: always()
        shell: bash
        env:
          BINARIES: ${{ steps.build.outputs.binaries }}
          FAILED: ${{ steps.build.outputs.failed }}
          NOLANG_VER: ${{ steps.build.outputs.nolang-version }}
        run: |
          echo "============================================"
          echo "  nogit Build Report"
          echo "============================================"
          echo "Nolang version: ${NOLANG_VER:-unknown}"
          echo ""
          echo "--- Built successfully ---"
          if [ -n "$BINARIES" ]; then
            printf '  %s\n' $BINARIES
          else
            echo "  (none)"
          fi
          echo ""
          echo "--- Failed targets ---"
          if [ -n "$FAILED" ]; then
            printf '  %s\n' $FAILED
          else
            echo "  (none)"
          fi

      - name: Smoke test nogit (linux/amd64)
        run: |
          set -e
          BIN="$GITHUB_WORKSPACE/dist/nogit-linux-amd64"
          if [ ! -f "$BIN" ]; then
            echo "::error::nogit linux/amd64 binary not found — critical build failure"
            exit 1
          fi
          chmod +x "$BIN"

          PASS=0; FAIL=0

          check() {
            local desc="$1" actual="$2" expected="$3"
            if [ "$actual" = "$expected" ]; then
              echo "  PASS: $desc"
              PASS=$((PASS+1))
            else
              echo "  FAIL: $desc"
              echo "    expected: '$expected'"
              echo "    actual:   '$actual'"
              FAIL=$((FAIL+1))
            fi
          }

          echo "=== nogit version ==="
          TAG="${GITHUB_REF_NAME:-dev}"
          VER="${TAG#v}"
          out=$("$BIN" version)
          check "version" "$out" "nolang-git v$VER (pure nolang)"

          echo "=== nogit init ==="
          rm -rf /tmp/nogit-smoke-test
          out=$("$BIN" init /tmp/nogit-smoke-test 2>&1)
          echo "  init output: $out"
          if [ -d /tmp/nogit-smoke-test/.git ]; then
            echo "  PASS: .git dir created"; PASS=$((PASS+1))
          else
            echo "  FAIL: .git dir missing"; FAIL=$((FAIL+1))
          fi
          if [ -f /tmp/nogit-smoke-test/.git/HEAD ]; then
            echo "  PASS: HEAD file exists"; PASS=$((PASS+1))
          else
            echo "  FAIL: HEAD file missing"; FAIL=$((FAIL+1))
          fi
          if [ -d /tmp/nogit-smoke-test/.git/objects ]; then
            echo "  PASS: objects dir exists"; PASS=$((PASS+1))
          else
            echo "  FAIL: objects dir missing"; FAIL=$((FAIL+1))
          fi
          if [ -d /tmp/nogit-smoke-test/.git/refs/heads ]; then
            echo "  PASS: refs/heads dir exists"; PASS=$((PASS+1))
          else
            echo "  FAIL: refs/heads dir missing"; FAIL=$((FAIL+1))
          fi

          echo "=== nogit add + commit ==="
          echo "hello nogit" > /tmp/nogit-smoke-test/readme.txt
          cd /tmp/nogit-smoke-test
          if "$BIN" add readme.txt 2>&1; then
            echo "  PASS: nogit add succeeded"; PASS=$((PASS+1))
          else
            echo "  FAIL: nogit add failed"; FAIL=$((FAIL+1))
          fi
          out=$("$BIN" commit -m "initial commit" 2>&1)
          echo "  commit output: $out"
          if [ -f /tmp/nogit-smoke-test/.git/refs/heads/main ]; then
            echo "  PASS: main branch created"; PASS=$((PASS+1))
          else
            echo "  FAIL: main branch missing"; FAIL=$((FAIL+1))
          fi

          echo "=== nogit log ==="
          out=$("$BIN" log 2>&1)
          echo "  log output: $out"
          if echo "$out" | grep -q "initial commit"; then
            echo "  PASS: log shows commit message"; PASS=$((PASS+1))
          else
            echo "  FAIL: log missing commit message"; FAIL=$((FAIL+1))
          fi

          echo ""
          echo "============================================"
          echo "  nogit Smoke test: $PASS passed, $FAIL failed"
          echo "============================================"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Upload nogit artifacts
        uses: actions/upload-artifact@v7
        with:
          name: nogit-binaries
          path: dist/nogit-*
          if-no-files-found: warn

  # ── 构建 noimg ───────────────────────────────────────────────────
  build-noimg:
    needs: detect-changes
    if: needs.detect-changes.outputs.needs-noimg == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - name: Inject version from tag
        shell: bash
        run: |
          TAG="${GITHUB_REF_NAME:-dev}"
          VER="${TAG#v}"
          echo "Injecting VERSION='$VER' (from tag '$TAG')"
          sed -i "s/^VERSION = 'dev'$/VERSION = '$VER'/" noimg/main.no
          grep -n '^VERSION' noimg/main.no

      - name: Build noimg for multiple platforms
        id: build
        uses: lizongying/nolang/.github/actions/build-nolang@v0.2.27
        with:
          version: "0.2.27"
          entry: noimg/main.no
          name: noimg
          targets: >-
            linux/amd64,
            linux/arm64,
            darwin/amd64,
            darwin/arm64,
            windows/amd64,
            windows/arm64
          cc: zig
          fail-on-error: "true"

      - name: Build report
        if: always()
        shell: bash
        env:
          BINARIES: ${{ steps.build.outputs.binaries }}
          FAILED: ${{ steps.build.outputs.failed }}
          NOLANG_VER: ${{ steps.build.outputs.nolang-version }}
        run: |
          echo "============================================"
          echo "  noimg Build Report"
          echo "============================================"
          echo "Nolang version: ${NOLANG_VER:-unknown}"
          echo ""
          echo "--- Built successfully ---"
          if [ -n "$BINARIES" ]; then
            printf '  %s\n' $BINARIES
          else
            echo "  (none)"
          fi
          echo ""
          echo "--- Failed targets ---"
          if [ -n "$FAILED" ]; then
            printf '  %s\n' $FAILED
          else
            echo "  (none)"
          fi

      - name: Smoke test noimg (linux/amd64)
        run: |
          set -e
          BIN="dist/noimg-linux-amd64"
          if [ ! -f "$BIN" ]; then
            echo "::error::noimg linux/amd64 binary not found — critical build failure"
            exit 1
          fi
          chmod +x "$BIN"

          PASS=0; FAIL=0

          check() {
            local desc="$1" actual="$2" expected="$3"
            if [ "$actual" = "$expected" ]; then
              echo "  PASS: $desc"
              PASS=$((PASS+1))
            else
              echo "  FAIL: $desc"
              echo "    expected: '$expected'"
              echo "    actual:   '$actual'"
              FAIL=$((FAIL+1))
            fi
          }

          echo "=== noimg version ==="
          TAG="${GITHUB_REF_NAME:-dev}"
          VER="${TAG#v}"
          out=$("$BIN" version)
          check "version" "$out" "img v$VER (pure Nolang image processing)"

          echo "=== noimg convert (PPM -> BMP) ==="
          printf 'P3\n2 2\n255\n255 0 0 0 255 0 0 0 255 255 255 0\n' > /tmp/test.ppm
          "$BIN" convert /tmp/test.ppm /tmp/test_out.bmp 2>&1
          if [ -f /tmp/test_out.bmp ]; then
            echo "  PASS: BMP output created"; PASS=$((PASS+1))
            SIZE=$(wc -c < /tmp/test_out.bmp)
            if [ "$SIZE" -gt 50 ]; then
              echo "  PASS: BMP file size reasonable ($SIZE bytes)"; PASS=$((PASS+1))
            else
              echo "  FAIL: BMP file too small ($SIZE bytes)"; FAIL=$((FAIL+1))
            fi
          else
            echo "  FAIL: BMP output not created"; FAIL=$((FAIL+1))
          fi

          echo "=== noimg convert (PPM -> PNG) ==="
          "$BIN" convert /tmp/test.ppm /tmp/test_out.png 2>&1
          if [ -f /tmp/test_out.png ]; then
            echo "  PASS: PNG output created"; PASS=$((PASS+1))
            # 检查 PNG 签名
            SIG=$(xxd -l 8 -p /tmp/test_out.png)
            if [ "$SIG" = "89504e470d0a1a0a" ]; then
              echo "  PASS: PNG signature correct"; PASS=$((PASS+1))
            else
              echo "  FAIL: PNG signature wrong: $SIG"; FAIL=$((FAIL+1))
            fi
          else
            echo "  FAIL: PNG output not created"; FAIL=$((FAIL+1))
          fi

          echo "=== noimg convert (PPM -> TGA) ==="
          "$BIN" convert /tmp/test.ppm /tmp/test_out.tga 2>&1
          if [ -f /tmp/test_out.tga ]; then
            echo "  PASS: TGA output created"; PASS=$((PASS+1))
          else
            echo "  FAIL: TGA output not created"; FAIL=$((FAIL+1))
          fi

          echo "=== noimg info ==="
          out=$("$BIN" info /tmp/test.ppm 2>&1)
          if echo "$out" | grep -qi "width\|height\|2\b"; then
            echo "  PASS: info shows image properties"; PASS=$((PASS+1))
          else
            echo "  FAIL: info output unexpected: $out"; FAIL=$((FAIL+1))
          fi

          echo "=== noimg grayscale ==="
          "$BIN" grayscale /tmp/test.ppm /tmp/gray_out.ppm 2>&1
          if [ -f /tmp/gray_out.ppm ]; then
            echo "  PASS: grayscale output created"; PASS=$((PASS+1))
          else
            echo "  FAIL: grayscale output not created"; FAIL=$((FAIL+1))
          fi

          echo "=== noimg invert ==="
          "$BIN" invert /tmp/test.ppm /tmp/inv_out.ppm 2>&1
          if [ -f /tmp/inv_out.ppm ]; then
            echo "  PASS: invert output created"; PASS=$((PASS+1))
          else
            echo "  FAIL: invert output not created"; FAIL=$((FAIL+1))
          fi

          echo ""
          echo "============================================"
          echo "  noimg Smoke test: $PASS passed, $FAIL failed"
          echo "============================================"
          [ "$FAIL" -eq 0 ] || exit 1

      - name: Upload noimg artifacts
        uses: actions/upload-artifact@v7
        with:
          name: noimg-binaries
          path: dist/noimg-*
          if-no-files-found: warn

  # ── 发布 Release ─────────────────────────────────────────────────
  release:
    if: ${{ !failure() && !cancelled() && startsWith(github.ref, 'refs/tags/') }}
    needs: [detect-changes, build-notools, build-nogit, build-noimg]
    runs-on: ubuntu-latest
    steps:
      - name: Download notools artifacts
        if: needs.detect-changes.outputs.needs-notools == 'true'
        uses: actions/download-artifact@v4
        with:
          name: notools-binaries
          path: artifacts

      - name: Download nogit artifacts
        if: needs.detect-changes.outputs.needs-nogit == 'true'
        uses: actions/download-artifact@v4
        with:
          name: nogit-binaries
          path: artifacts

      - name: Download noimg artifacts
        if: needs.detect-changes.outputs.needs-noimg == 'true'
        uses: actions/download-artifact@v4
        with:
          name: noimg-binaries
          path: artifacts

      - name: Generate checksums and build release notes
        id: prep
        shell: bash
        env:
          NEEDS_NOTOOLS: ${{ needs.detect-changes.outputs.needs-notools }}
          NEEDS_NOGIT: ${{ needs.detect-changes.outputs.needs-nogit }}
          NEEDS_NOIMG: ${{ needs.detect-changes.outputs.needs-noimg }}
          LAST_TAG: ${{ needs.detect-changes.outputs.last-tag }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          cd artifacts

          echo "============================================"
          echo "  Release Asset Summary"
          echo "============================================"
          echo "  notools: $NEEDS_NOTOOLS"
          echo "  nogit:   $NEEDS_NOGIT"
          echo "  noimg:   $NEEDS_NOIMG"
          echo "  last-tag: $LAST_TAG"
          echo "============================================"

          # 只对存在的文件生成 checksums
          if ls * 2>/dev/null | head -1 > /dev/null; then
            sha256sum * > checksums-sha256.txt
          else
            echo "(no binaries)" > checksums-sha256.txt
          fi

          echo "--- Artifacts ---"
          ls -lh

          # 构建未变更子项目提示
          UNCHANGED=""
          [ "$NEEDS_NOTOOLS" != "true" ] && [ -n "$LAST_TAG" ] && UNCHANGED="${UNCHANGED}### notools\n\n本次未变更，二进制请从 [${LAST_TAG}](https://github.com/${REPO}/releases/download/${LAST_TAG}/notools-linux-amd64) 下载。\n\n"
          [ "$NEEDS_NOGIT" != "true" ] && [ -n "$LAST_TAG" ] && UNCHANGED="${UNCHANGED}### nogit\n\n本次未变更，二进制请从 [${LAST_TAG}](https://github.com/${REPO}/releases/download/${LAST_TAG}/nogit-linux-amd64) 下载。\n\n"
          [ "$NEEDS_NOIMG" != "true" ] && [ -n "$LAST_TAG" ] && UNCHANGED="${UNCHANGED}### noimg\n\n本次未变更，二进制请从 [${LAST_TAG}](https://github.com/${REPO}/releases/download/${LAST_TAG}/noimg-linux-amd64) 下载。\n\n"

          # 输出到 GITHUB_ENV 供 release step 的 body 引用
          {
            echo "UNCHANGED_NOTES<<EOF"
            echo -e "$UNCHANGED"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/notools-*
            artifacts/nogit-*
            artifacts/noimg-*
            artifacts/checksums-sha256.txt
          body: |
            ## notools ${{ github.ref_name }}

            Unix 常用命令行工具集 + 纯 Nolang Git 实现 + 纯 Nolang 图像处理工具库，使用 [Nolang](https://github.com/lizongying/nolang) 语言实现。

            ### 下载与安装

            ```bash
            # notools (Linux amd64 示例)
            curl -fsSL -o notools https://github.com/lizongying/notools/releases/download/${{ github.ref_name }}/notools-linux-amd64
            chmod +x notools
            sudo mv notools /usr/local/bin/

            # nogit (纯 Nolang Git 实现)
            curl -fsSL -o nogit https://github.com/lizongying/notools/releases/download/${{ github.ref_name }}/nogit-linux-amd64
            chmod +x nogit
            sudo mv nogit /usr/local/bin/nogit

            # noimg (纯 Nolang 图像处理工具)
            curl -fsSL -o noimg https://github.com/lizongying/notools/releases/download/${{ github.ref_name }}/noimg-linux-amd64
            chmod +x noimg
            sudo mv noimg /usr/local/bin/noimg
            ```

            ### 校验

            下载同目录下的 `checksums-sha256.txt` 进行 SHA-256 校验。

            ---

            ${{ env.UNCHANGED_NOTES }}
          generate_release_notes: true
          draft: false
          prerelease: false

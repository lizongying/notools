name: Build

# 使用 nolang 的 build-nolang action 构建多平台二进制文件。
# 本工作流同时充当 nolang 构建系统的集成测试：
#   1. 测试 setup-nolang 逻辑（下载编译器 + 标准库源码）
#   2. 测试工具链安装（LLVM opt/llc + Zig 交叉编译器）
#   3. 测试 no build 交叉编译 6 个目标平台
#   4. 对产物运行 smoke test 验证正确性
#   5. tag 推送时发布 GitHub Release
#
# 依赖：lizongying/nolang 仓库的 .github/actions/build-nolang action

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # ── 1a. 构建 notools：调用 build-nolang action ──────────────────
      - name: Build notools for multiple platforms
        id: build
        uses: lizongying/nolang/.github/actions/build-nolang@v0.2.9
        with:
          version: "0.2.9"
          entry: notools/main.no
          name: notools
          targets: >-
            linux/amd64,
            linux/arm64,
            darwin/amd64,
            darwin/arm64,
            windows/amd64,
            windows/arm64
          cc: zig
          # 单个目标失败不终止整个 job，继续构建其他平台以获取完整测试结果
          fail-on-error: "false"

      # ── 1b. 构建 git：纯 Nolang Git 实现 ───────────────────────────
      - name: Build git for multiple platforms
        id: build-git
        uses: lizongying/nolang/.github/actions/build-nolang@v0.2.11
        with:
          version: "0.2.11"
          entry: git/main.no
          name: git
          targets: >-
            linux/amd64,
            linux/arm64,
            darwin/amd64,
            darwin/arm64
          cc: zig
          fail-on-error: "false"

      # ── 2. 构建结果报告 ───────────────────────────────────────────────
      - name: Build report
        if: always()
        shell: bash
        env:
          BINARIES: ${{ steps.build.outputs.binaries }}
          FAILED: ${{ steps.build.outputs.failed }}
          GIT_BINARIES: ${{ steps.build-git.outputs.binaries }}
          GIT_FAILED: ${{ steps.build-git.outputs.failed }}
          NOLANG_VER: ${{ steps.build.outputs.nolang-version }}
        run: |
          echo "============================================"
          echo "  Nolang Build Test Report"
          echo "============================================"
          echo "Nolang version: ${NOLANG_VER:-unknown}"
          echo ""
          echo "--- notools: Built successfully ---"
          if [ -n "$BINARIES" ]; then
            printf '  %s\n' $BINARIES
          else
            echo "  (none)"
          fi
          echo ""
          echo "--- notools: Failed targets ---"
          if [ -n "$FAILED" ]; then
            printf '  %s\n' $FAILED
          else
            echo "  (none)"
          fi
          echo ""
          echo "--- git: Built successfully ---"
          if [ -n "$GIT_BINARIES" ]; then
            printf '  %s\n' $GIT_BINARIES
          else
            echo "  (none)"
          fi
          echo ""
          echo "--- git: Failed targets ---"
          if [ -n "$GIT_FAILED" ]; then
            printf '  %s\n' $GIT_FAILED
          else
            echo "  (none)"
          fi
          echo ""
          echo "--- dist/ contents ---"
          ls -lh dist/ 2>/dev/null || echo "  dist/ not found"

      # ── 3a. Smoke test：验证 notools linux/amd64 产物功能正确 ─────────
      - name: Smoke test notools (linux/amd64)
        run: |
          set -e
          BIN="dist/notools-linux-amd64"
          if [ ! -f "$BIN" ]; then
            echo "::error::notools linux/amd64 binary not found — critical build failure"
            exit 1
          fi
          chmod +x "$BIN"

          PASS=0; FAIL=0

          check() {
            local desc="$1" actual="$2" expected="$3"
            if [ "$actual" = "$expected" ]; then
              echo "  PASS: $desc"
              PASS=$((PASS+1))
            else
              echo "  FAIL: $desc"
              echo "    expected: '$expected'"
              echo "    actual:   '$actual'"
              FAIL=$((FAIL+1))
            fi
          }

          echo "=== echo ==="
          out=$(echo "hello notools" | "$BIN" echo)
          check "echo stdin" "$out" "hello notools"

          echo "=== md5 ==="
          out=$(echo -n abc | "$BIN" md5)
          check "md5(abc)" "$out" "900150983cd24fb0d6963f7d28e17f72"

          echo "=== sha1 ==="
          out=$(echo -n abc | "$BIN" sha1)
          check "sha1(abc)" "$out" "a9993e364706816aba3e25717850c26c9cd0d89d"

          echo "=== sha256 ==="
          out=$(echo -n abc | "$BIN" sha256)
          check "sha256(abc)" "$out" "ba7816bf8f01cfea414140de5dae2223b00361a396177a9cb410ff61f20015ad"

          echo "=== sha512 ==="
          out=$(echo -n abc | "$BIN" sha512)
          expected="ddaf35a193617abacc417349ae20413112e6fa4e89a97ea20a9eeee64b55d39a2192992a274fc1a836ba3c23a3feebbd454d4423643ce80e2a9ac94fa54ca49f"
          check "sha512(abc)" "$out" "$expected"

          echo "=== hmac ==="
          out=$(echo -n abc | "$BIN" hmac -a sha256 -k key)
          check "hmac-sha256(abc,key)" "$out" "9c196e32dc0175f86f4b1cb89289d6619de6bee699e4c378e68309ed97a1a6ab"

          echo "=== basename ==="
          out=$("$BIN" basename /tmp/foo/bar.txt)
          check "basename" "$out" "bar.txt"

          echo "=== dirname ==="
          out=$("$BIN" dirname /tmp/foo/bar.txt)
          check "dirname" "$out" "/tmp/foo"

          echo "=== seq ==="
          out=$("$BIN" seq 1 5 | tr '\n' ' ')
          check "seq 1 5" "$out" "1 2 3 4 5 "

          echo ""
          echo "============================================"
          echo "  notools Smoke test: $PASS passed, $FAIL failed"
          echo "============================================"
          [ "$FAIL" -eq 0 ] || exit 1

      # ── 3b. Smoke test：验证 git linux/amd64 产物功能正确 ─────────────
      - name: Smoke test git (linux/amd64)
        run: |
          set -e
          BIN="dist/git-linux-amd64"
          if [ ! -f "$BIN" ]; then
            echo "::warning::git linux/amd64 binary not found — skipping git smoke test"
            exit 0
          fi
          chmod +x "$BIN"

          PASS=0; FAIL=0

          check() {
            local desc="$1" actual="$2" expected="$3"
            if [ "$actual" = "$expected" ]; then
              echo "  PASS: $desc"
              PASS=$((PASS+1))
            else
              echo "  FAIL: $desc"
              echo "    expected: '$expected'"
              echo "    actual:   '$actual'"
              FAIL=$((FAIL+1))
            fi
          }

          echo "=== git version ==="
          out=$("$BIN" version)
          check "version" "$out" "nolang-git v0.1.0 (pure nolang)"

          echo "=== git init ==="
          rm -rf /tmp/git-smoke-test
          out=$("$BIN" init /tmp/git-smoke-test 2>&1)
          echo "  init output: $out"
          [ -d /tmp/git-smoke-test/.git ] && echo "  PASS: .git dir created" && PASS=$((PASS+1)) || echo "  FAIL: .git dir missing" && FAIL=$((FAIL+1))
          [ -f /tmp/git-smoke-test/.git/HEAD ] && echo "  PASS: HEAD file exists" && PASS=$((PASS+1)) || echo "  FAIL: HEAD file missing" && FAIL=$((FAIL+1))
          [ -d /tmp/git-smoke-test/.git/objects ] && echo "  PASS: objects dir exists" && PASS=$((PASS+1)) || echo "  FAIL: objects dir missing" && FAIL=$((FAIL+1))
          [ -d /tmp/git-smoke-test/.git/refs/heads ] && echo "  PASS: refs/heads dir exists" && PASS=$((PASS+1)) || echo "  FAIL: refs/heads dir missing" && FAIL=$((FAIL+1))

          echo "=== git add + commit ==="
          echo "hello git" > /tmp/git-smoke-test/readme.txt
          cd /tmp/git-smoke-test
          "$BIN" add readme.txt 2>&1
          out=$("$BIN" commit -m "initial commit" 2>&1)
          echo "  commit output: $out"
          [ -f /tmp/git-smoke-test/.git/refs/heads/main ] && echo "  PASS: main branch created" && PASS=$((PASS+1)) || echo "  FAIL: main branch missing" && FAIL=$((FAIL+1))

          echo "=== git log ==="
          out=$("$BIN" log 2>&1)
          echo "  log output: $out"
          echo "$out" | grep -q "initial commit" && echo "  PASS: log shows commit message" && PASS=$((PASS+1)) || echo "  FAIL: log missing commit message" && FAIL=$((FAIL+1))

          echo ""
          echo "============================================"
          echo "  git Smoke test: $PASS passed, $FAIL failed"
          echo "============================================"
          [ "$FAIL" -eq 0 ] || exit 1

      # ── 4. 上传产物 ─────────────────────────────────────────────────
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: notools-binaries
          path: dist/*
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: notools-binaries
          path: artifacts

      - name: Generate checksums
        working-directory: artifacts
        run: |
          sha256sum * > checksums-sha256.txt
          echo "## Artifacts"
          ls -lh
          echo ""
          echo "### SHA-256"
          cat checksums-sha256.txt

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/notools-linux-amd64
            artifacts/notools-linux-arm64
            artifacts/notools-darwin-amd64
            artifacts/notools-darwin-arm64
            artifacts/notools-windows-amd64.exe
            artifacts/notools-windows-arm64.exe
            artifacts/git-linux-amd64
            artifacts/git-linux-arm64
            artifacts/git-darwin-amd64
            artifacts/git-darwin-arm64
            artifacts/checksums-sha256.txt
          body: |
            ## notools ${{ github.ref_name }}

            Unix 常用命令行工具集 + 纯 Nolang Git 实现，使用 [Nolang](https://github.com/lizongying/nolang) 语言实现。

            ### 下载与安装

            ```bash
            # Linux amd64 示例
            curl -fsSL -o notools https://github.com/lizongying/notools/releases/download/${{ github.ref_name }}/notools-linux-amd64
            chmod +x notools
            sudo mv notools /usr/local/bin/

            # git (纯 Nolang 实现)
            curl -fsSL -o git https://github.com/lizongying/notools/releases/download/${{ github.ref_name }}/git-linux-amd64
            chmod +x git
            sudo mv git /usr/local/bin/nolang-git
            ```

            ### 校验

            下载同目录下的 `checksums-sha256.txt` 进行 SHA-256 校验。
          generate_release_notes: true
          draft: false
          prerelease: false
